---
layout: default
---
<article class="post-article">
  <header class="article-header reading-width"><a class="back-link" href="{{ '/#writing' | relative_url }}">← Writing</a><p class="eyebrow">Notes from the work</p><h1>{{ page.title }}</h1><p class="article-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.reading_time %} · {{ page.reading_time }} min read{% endif %}</p></header>
  <div class="article-body"><div class="reading-width prose">{{ content }}</div></div>
  <footer class="article-bottom reading-width"><a href="{{ '/#writing' | relative_url }}">← All writing</a><a href="mailto:{{ site.author.email }}">Send me a note ↗</a></footer>
</article>
