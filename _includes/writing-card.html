<a class="writing-card writing-card--{{ include.post.cover_theme }}" href="{{ include.post.url | relative_url }}">
  {% if include.post.cover %}<img src="{{ include.post.cover | relative_url }}" alt="" width="1200" height="800" loading="lazy">{% endif %}
  <div class="writing-card-copy"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time><h3>{{ include.post.card_title | default: include.post.title }}</h3><p>{{ include.post.card_description | default: include.post.excerpt | strip_html }}</p><span class="read-story">Read the story ↗</span></div>
</a>
